# TODO pin to SHA: third-party actions below are referenced by tag; SHAs could not be looked up offline.
# Builds release binaries when a tag like v1.0.0 is pushed and attaches them
# (plus SHA256 sums) to the GitHub release.
# Manual dry run: Actions > release > Run workflow. It builds, tests and uploads the archives as
# workflow artifacts but never creates a release (the publish job only runs for a pushed tag).
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    # Dry run from any branch named dryrun-v<version>, for example dryrun-v1.0.0-beta: GitHub only allows a
    # manual run of a workflow that exists on the default branch, a branch push works from anywhere.
    # The publish job below only runs for tags, so this never creates a release.
    branches:
      - "dryrun-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the archive names (dry run only, no release is created)"
        default: "v0.0.0-dryrun"
        type: string

env:
  CARGO_TERM_COLOR: always
  # Tag on a tag push, the typed label on a manual dry run (a branch name would contain slashes).
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-name: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target-name: windows-x64
            rust-target: x86_64-pc-windows-msvc
            archive: zip
          # Intel macOS is cross-compiled on the Apple Silicon runner (the macos-13 image is retired);
          # it cannot be run there, so it is built but not tested.
          - os: macos-latest
            target-name: macos-x64
            rust-target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target-name: macos-arm64
            rust-target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      # The tag must match the crate version, so `killer --version` agrees with the release.
      - name: Check tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          crate="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' SOURCE/src/v2-rust/killer/Cargo.toml | head -n 1)"
          if [ "v$crate" != "${RELEASE_VERSION%%-*}" ]; then
            echo "tag $RELEASE_VERSION does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      # `killer` is the driver (run, fmt, test, ...); killer_super is the compiler pipeline.
      - name: Build killer and killer_super
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --locked --release --bin killer --bin killer_super --target ${{ matrix.rust-target }}

      # macos-x64 is cross-compiled on an arm64 runner and cannot be executed there.
      - name: Smoke test
        if: matrix.target-name != 'macos-x64'
        shell: bash
        working-directory: SOURCE/src/v2-rust/killer
        run: |
          bin="target/${{ matrix.rust-target }}/release/killer"
          "$bin" --version
          echo 'print("hello from killer")' > "$RUNNER_TEMP/hello.killer"
          out="$("$bin" run "$RUNNER_TEMP/hello.killer" | tr -d '\r')"
          echo "$out"
          [ "$out" = "hello from killer" ]
          crate="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          "$bin" --version | grep -F "$crate"

      # The header promises a dry run that tests, so run the library tests here (not on the cross-compiled macos-x64).
      - name: Unit tests
        if: matrix.target-name != 'macos-x64'
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo test --locked --lib --target ${{ matrix.rust-target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="killer_super-${RELEASE_VERSION}-${{ matrix.target-name }}"
          mkdir "$name"
          for b in killer killer_super; do
            cp "SOURCE/src/v2-rust/killer/target/${{ matrix.rust-target }}/release/$b" "$name/"
          done
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "killer_super-$env:RELEASE_VERSION-${{ matrix.target-name }}"
          New-Item -ItemType Directory $name | Out-Null
          foreach ($b in "killer", "killer_super") {
            Copy-Item "SOURCE/src/v2-rust/killer/target/${{ matrix.rust-target }}/release/$b.exe" $name
          }
          Copy-Item LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target-name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  publish:
    name: Publish release
    permissions:
      contents: write
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: SOURCE/src/v2-rust/killer/docs/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # the hand-written notes come first (they hold the security warning), GitHub appends the change list
          body_path: SOURCE/src/v2-rust/killer/docs/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
