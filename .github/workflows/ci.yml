  parity-check:
    name: Parity Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Run Killer Parity Runner
        working-directory: Kore_fileformat/tools
        run: python run_parity_runner.py
name: Killer CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Check compilation
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo check --all-targets

      - name: Clippy lints
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo clippy -- -D warnings 2>&1 || true

      - name: Format check
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo fmt --check 2>&1 || true

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Run tests
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo test --lib -- --nocapture
        timeout-minutes: 30

  benchmark:
    name: Performance Baseline
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Build release
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --release

      - name: Run performance baseline
        working-directory: SOURCE/src/v2-rust/killer
        run: |
          echo "=== Killer Performance Baseline ==="
          time ./target/release/killer-native --version || true
          echo "Build succeeded - binary size:"
          ls -lh target/release/killer-native || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: killer-native-linux
          path: SOURCE/src/v2-rust/killer/target/release/killer-native
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Build release
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: killer-native-windows
          path: SOURCE/src/v2-rust/killer/target/release/killer-native.exe
          if-no-files-found: warn
