name: Killer CI

on:
  push:
    branches: [ main, develop, feature/assistant-ki ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Check compilation
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo check --all-targets

      # Clippy and rustfmt are REPORT-ONLY: they never fail the build (the "|| true"
      # is deliberate). Warnings are visible in the log but are not gating.
      - name: Clippy lints (report-only, non-blocking)
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo clippy 2>&1 || true

      - name: Format check (report-only, non-blocking)
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo fmt --check 2>&1 || true

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Run tests (lib + all integration tests)
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo test --tests --no-fail-fast
        timeout-minutes: 40

      - name: Build debug binary for parity / docs checks
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --bin killer_super

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Language parity audit
        working-directory: SOURCE/src/v2-rust/killer
        env:
          KILLER_BIN: ${{ github.workspace }}/SOURCE/src/v2-rust/killer/target/debug/killer_super${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python parity/run_parity.py

      - name: Documentation examples
        working-directory: SOURCE/src/v2-rust/killer
        env:
          KILLER_BIN: ${{ github.workspace }}/SOURCE/src/v2-rust/killer/target/debug/killer_super${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python docs/check_examples.py

      - name: Documentation links
        working-directory: SOURCE/src/v2-rust/killer
        run: python docs/check_links.py

  cross-check:
    name: Type-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"
      - name: cargo check (type-check only, no linking)
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo check --lib --bins --tests --target ${{ matrix.target }}

  bench-smoke:
    name: Benchmark smoke (no gating)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build debug binary
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --bin killer_super
      # Smoke only: one run of a few benchmarks to prove the runner works.
      # Debug build timings are meaningless and nothing here gates the build.
      - name: Run a few benchmarks once
        working-directory: SOURCE/src/v2-rust/killer
        env:
          KILLER_BIN: ${{ github.workspace }}/SOURCE/src/v2-rust/killer/target/debug/killer_super
        run: python bench/run.py -n 1 list_ops str_concat dict_ops || true

  benchmark:
    name: Performance Baseline
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Build release
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --release

      - name: Run performance baseline
        working-directory: SOURCE/src/v2-rust/killer
        run: |
          echo "=== Killer Performance Baseline ==="
          time ./target/release/killer-native --version || true
          echo "Build succeeded - binary size:"
          ls -lh target/release/killer-native || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: killer-native-linux
          path: SOURCE/src/v2-rust/killer/target/release/killer-native
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SOURCE/src/v2-rust/killer"

      - name: Build release
        working-directory: SOURCE/src/v2-rust/killer
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: killer-native-windows
          path: SOURCE/src/v2-rust/killer/target/release/killer-native.exe
          if-no-files-found: warn
