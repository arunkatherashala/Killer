# TODO pin to SHA: third-party actions below are referenced by tag; SHAs could not be looked up offline.
name: kpm CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test kpm
        working-directory: tools/kpm
        run: cargo test --verbose --locked