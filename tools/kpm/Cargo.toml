[package]
name = "kpm"
version = "0.1.0"
edition = "2021"
authors = ["Killer Team <devs@killer.local>"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.6"
flate2 = "1.0"
tar = "0.4"

[profile.dev]
opt-level = 0
