[package]
name = "killer-lsp"
version = "2.1.0"
edition = "2021"
description = "Killer Language Server Protocol implementation"
license = "MIT"

[[bin]]
name = "killer-lsp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
